name: Build IPA

on:
  workflow_dispatch:        # 在 Actions 分頁手動按 Run workflow
  push:
    paths:
      - "WebTranslator/**"
      - "WebTranslator.xcodeproj/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 選用 Xcode 16 以上（需要 iOS 18 SDK）
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi -e beta -e rc | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: 編譯（不簽章，交給 Sideloadly 簽）
        run: |
          xcodebuild -project WebTranslator.xcodeproj -target WebTranslator \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: 打包 IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/WebTranslator.app Payload/
          zip -qry WebTranslator.ipa Payload
          ls -lh WebTranslator.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WebTranslator-ipa
          path: WebTranslator.ipa
          retention-days: 14
